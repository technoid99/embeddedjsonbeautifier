<!DOCTYPE html>
<html>
<head>
  <title>JSON Explorer</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    select, button, input[type="file"] { margin: 10px 0; padding: 5px; }
    pre { background: #f4f4f4; padding: 10px; max-height: 300px; overflow: auto; }
  </style>
</head>
<body>

<h2>JSON Explorer</h2>

<input type="file" accept=".json" onchange="handleFileUpload(event)">
<br>
<button onclick="showKeys()">Show Keys</button>
<br>
<select id="keySelector" onchange="showUniqueValues()">
  <option>Select a key</option>
</select>
<br>
<button onclick="exportToText()">Export View to .txt</button>

<pre id="output">Upload a JSON file to begin.</pre>

<script>
  let jsonData = [];

  function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!Array.isArray(parsed)) {
          document.getElementById('output').textContent = 'Error: JSON must be an array of objects.';
          return;
        }
        jsonData = parsed;
        document.getElementById('output').textContent = 'JSON loaded. Click "Show Keys" to begin.';
      } catch (err) {
        document.getElementById('output').textContent = 'Error parsing JSON: ' + err.message;
      }
    };
    reader.readAsText(file);
  }

  function getAllKeys(data, prefix = '') {
    const keys = new Set();

    data.forEach(item => {
      for (let key in item) {
        const value = item[key];
        const path = prefix ? `${prefix}.${key}` : key;

        if (Array.isArray(value)) {
          keys.add(path + '[]');
        } else if (typeof value === 'object' && value !== null) {
          getAllKeys([value], path).forEach(k => keys.add(k));
        } else {
          keys.add(path);
        }
      }
    });

    return [...keys].sort();
  }

  function showKeys() {
    if (!jsonData.length) {
      document.getElementById('output').textContent = 'No JSON data loaded.';
      return;
    }

    const keyList = getAllKeys(jsonData);
    const selector = document.getElementById('keySelector');
    selector.innerHTML = '<option>Select a key</option>';
    keyList.forEach(key => {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = key;
      selector.appendChild(opt);
    });
    document.getElementById('output').textContent = 'Keys loaded. Select one to see unique values.';
  }

  function showUniqueValues() {
    const key = document.getElementById('keySelector').value;
    if (!key || key === 'Select a key') return;

    const results = new Set();
    const pathParts = key.replace(/\[\]$/, '').split('.');

    jsonData.forEach(item => {
      let value = item;
      for (let part of pathParts) {
        if (value && typeof value === 'object') {
          value = value[part];
        } else {
          value = undefined;
          break;
        }
      }

      if (Array.isArray(value)) {
        value.forEach(v => results.add(v));
      } else if (value !== undefined) {
        results.add(value);
      }
    });

    const sorted = [...results].sort();
    document.getElementById('output').textContent = sorted.join('\n');
  }

  function exportToText() {
    const text = document.getElementById('output').textContent;
    const blob = new Blob([text], { type: 'text/plain' });
    const link = document.createElement('a');
    link.download = 'json_explorer_output.txt';
    link.href = URL.createObjectURL(blob);
    link.click();
  }
</script>

</body>
</html>
